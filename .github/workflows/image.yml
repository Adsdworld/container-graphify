name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n rootfs/usr/local/bin/entrypoint.sh
          bash -n rootfs/usr/local/bin/graphify-build
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: container-graphify:test
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eu
          mkdir -p work/pkg
          printf 'def a():\n    return b()\n\n\ndef b():\n    return 1\n' > work/pkg/m.py
          chmod -R a+rwX work

          run() {
            docker run --rm --network none -v "$PWD/work:/work" "$@"
          }

          # Same code, same output.
          run container-graphify:test
          test -s work/graphify-out/graph.json
          test -s work/graphify-out/GRAPH_REPORT.md
          test -s work/graphify-out/graph.html
          test ! -e work/graphify-out/cache
          cp -r work/graphify-out first
          run container-graphify:test
          diff -r first work/graphify-out

          # Another command runs as is.
          run container-graphify:test graphify path a b | grep -q 'b'

      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
